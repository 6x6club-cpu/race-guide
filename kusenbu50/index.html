<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#592ba7">
<title>KUSENBU QUEST 50 大会案内</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--ink:#111111;--sub:#5e5870;--line:#d6d0e6;--bg:#eae7f3;--card:#fff;--acc:#592ba7;--w:#b45309;--red:#b91c1c}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.65 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg)}
header{background:#592ba7;color:#fff;padding:14px 16px 12px}header .t{font-size:20px;font-weight:800;letter-spacing:.02em}header .d{color:#e2d9f3;font-size:14px}
.st{font-size:12.5px;padding:7px 16px;background:#f4f1fa;color:#3d1d76;border-bottom:1px solid var(--line)}.st.off{background:#fff3d6;color:#7c4a03}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.notice{border-radius:12px;padding:12px 14px;margin:0 0 10px;border:2px solid var(--red);background:#fff5f5}.notice .h{font-weight:800;color:var(--red);font-size:13px}.notice.n{border:1px solid var(--line);background:#fff}.notice.n .h{color:var(--sub)}
.notice .tm{font-size:12px;color:var(--sub)}
.sum dt{font-size:12.5px;color:var(--sub);margin-top:10px}.sum dt:first-child{margin-top:0}.sum dd{margin:0;font-weight:700;font-size:16.5px}.sum dd small{display:block;font-weight:400;font-size:13.5px;color:var(--sub)}
.links a{display:inline-block;margin:6px 6px 0 0;font-size:14px;color:var(--acc)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}.nav a{display:block;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 6px;font-weight:700;color:var(--ink);text-decoration:none;font-size:16px}
.nav a:last-child:nth-child(odd){grid-column:1/-1}
.nav.after a{background:#f4f1fa;border-color:#c9bce4}
.btn{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.saved{font-size:13.5px;margin-top:8px}.saved b{color:var(--acc)}
.sec h2{font-size:17px;margin:18px 0 6px;border-left:4px solid var(--acc);padding-left:8px}.sec h2:first-child{margin-top:0}.sec ul{margin:0;padding-left:1.2em}.sec li{margin:3px 0}.sec img{width:100%;border-radius:8px;margin:8px 0;border:1px solid var(--line)}.sec p{margin:6px 0}
.tbd{color:var(--w);font-weight:700}
.back{display:inline-block;margin:0 0 10px;color:var(--acc);text-decoration:none;font-size:15px}
input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;width:100%;font-size:18px}
.res .big{font-size:30px;font-weight:800}.res table{width:100%;border-collapse:collapse;font-size:14px}.res td,.res th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.muted{color:var(--sub);font-size:13.5px}.err{color:var(--red);font-size:14px;margin-top:6px}
canvas.cert{width:100%;border:1px solid var(--line);border-radius:6px;margin:10px 0}
  .gmap{position:relative;width:100%;aspect-ratio:4/3;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:8px 0;background:#e8e6df}.gmap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gmap-off{border:1px dashed #b3a6d1;border-radius:10px;padding:14px;margin:8px 0;background:#f8f6fc;font-size:14.5px}.gbtn{text-align:center;text-decoration:none;margin-top:6px}.gbtn.dis{background:#a99bc8}
.bibq{border:3px solid var(--acc);background:#fff}.bibq h2{margin:0 0 4px;font-size:20px;color:var(--acc)}.bibq input{font-size:20px;padding:14px;margin:8px 0}.bibq .btn{font-size:19px;padding:16px}
.mybib{display:block;width:100%;background:var(--acc);color:#fff;border:0;border-radius:14px;padding:12px 14px 14px;text-align:center;cursor:pointer;margin:0 0 12px;font:inherit}.mybib .l{font-size:14px;color:#e2d9f3}.mybib .n{font-size:64px;font-weight:900;line-height:1.05;letter-spacing:.02em}.mybib .p{font-size:16px;font-weight:700}.mybib .tap{font-size:12.5px;color:#e2d9f3;margin-top:2px}
.mini{background:none;border:0;color:var(--acc);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px 0}
#bigbib{position:fixed;inset:0;z-index:50;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom));overflow:auto}
#bigbib .l{font-size:20px;font-weight:700;color:#e2d9f3}#bigbib .n{font-size:min(44vw,300px);font-weight:900;line-height:1;margin:6px 0 14px;letter-spacing:-.02em}#bigbib .n.s{font-size:min(30vw,200px)}
#bigbib .chip{display:inline-block;background:#fff;color:var(--acc);border-radius:999px;padding:8px 18px;font-size:20px;font-weight:800;margin:4px}
#bigbib .who{font-size:clamp(26px,8vw,40px);font-weight:900;line-height:1.25;margin:0 0 14px;word-break:break-all}#bigbib .who small{font-size:.6em;font-weight:700;margin-left:.2em}#bigbib .pk{font-size:15px;font-weight:700;background:rgba(255,255,255,.16);border-radius:10px;padding:8px 12px;margin:10px auto 0;max-width:420px;line-height:1.5}
.mybib .who{font-size:22px;font-weight:900;line-height:1.3;word-break:break-all}.mybib .who small{font-size:.65em;margin-left:.2em}.mybib .pk{font-size:13px;color:#fff;background:rgba(255,255,255,.16);border-radius:8px;padding:5px 8px;margin:6px auto 2px;display:inline-block}
#bigbib{justify-content:flex-start}#bigbib>:first-child{margin-top:auto}#bigbib>:last-child{margin-bottom:auto}#bigbib .n{font-size:min(36vw,260px)}#bigbib .n.s{font-size:min(26vw,190px)}#bigbib .n.xs{font-size:min(19vw,140px);white-space:nowrap}
#bigbib .qr{background:#fff;border-radius:14px;padding:10px;margin:14px auto 0;width:min(52vw,210px)}#bigbib .qr svg{display:block;width:100%;height:auto}#bigbib .qrl{font-size:13px;color:#e2d9f3;margin-top:6px}
#bigbib .say{font-size:18px;margin:18px 0 22px;line-height:1.5}#bigbib .x{background:#fff;color:var(--acc);border:0;border-radius:12px;padding:14px 40px;font-size:18px;font-weight:800}
.pkb{display:block;width:100%;box-sizing:border-box;border:3px solid #fff;border-radius:14px;padding:10px 14px;margin:12px auto 0;max-width:440px;font-size:30px;font-weight:900;line-height:1.2;color:#fff}.pkb small{display:block;font-size:17px;font-weight:800;line-height:1.45;margin-top:4px}
.pkb.ok{background:#15803d}.pkb.ng{background:#dc2626}.pkb.sm{font-size:22px;padding:8px 10px;margin:8px auto 4px}.pkb.sm small{font-size:14px}
.rtabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.rtab{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 10px;font:inherit;font-weight:700;cursor:pointer}.rtab.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.rtbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}.rtbl th,.rtbl td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}.rtbl tr[data-bib]{cursor:pointer}.rtbl td:last-child{font-variant-numeric:tabular-nums;white-space:nowrap}
#bigbib .cand{border-top:1px solid rgba(255,255,255,.35);padding:10px 0;width:100%;max-width:420px}

.inapp{border:3px solid #f59e0b;background:#fffbeb}.inapp a.btn{display:block;text-align:center;text-decoration:none}
footer{font-size:12px;color:var(--sub);text-align:center;padding:16px}
</style></head>
<body>
<header><div class="t">KUSENBU QUEST 50</div><div class="d" id="date">大会案内</div></header>
<div class="st" id="st">読み込み中…</div>
<main id="main"></main>
<footer>大会本部（緊急連絡先）<span id="emg"></span><br>KUSENBU QUEST 50 実行委員会・7trails</footer>
<script src="qrcode.js"></script>
<script>
'use strict';
const RACE='kusenbu50',CACHE='kq50-guide-v1';
const BASE_LIST=['./','index.html','manifest.json','data/guide.json','data/notices.json','data/results.json','data/bibs.json','qrcode.js'];
const imgList=()=>[...new Set(((D.guide&&D.guide.sections)||[]).flatMap(s=>[...String(s.body).matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)].map(m=>m[1])))];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const fmt=iso=>{if(!iso)return '—';const d=new Date(iso);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
const D={guide:null,notices:null,results:null,bibs:null,src:{},fetchedAt:{}};

/* データ：通信できれば最新、だめなら保存した版 */
async function getJSON(name){
  const url='data/'+name+'.json';
  try{
    const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const j=await r.json();if(r.headers.get('X-Saved-Copy')){D.src[name]='cache';return j}D.src[name]='net';D.fetchedAt[name]=new Date().toISOString();
    // 保存済みなら控えも最新に入れ替える
    if(LS.get('kq50-saved',null)&&'caches' in window){try{const c=await caches.open(CACHE);await c.put(url,new Response(JSON.stringify(j),{headers:{'Content-Type':'application/json'}}))}catch(e){}}
    return j;
  }catch(e){
    if('caches' in window){const c=await caches.open(CACHE);const m=await c.match(url);if(m){D.src[name]='cache';return m.json()}}
    D.src[name]='none';return null;
  }
}
async function load(){
  const [g,n,r,b]=await Promise.all(['guide','notices','results','bibs'].map(getJSON));
  D.guide=g;D.notices=n;D.results=r;D.bibs=b;render();
  if(navigator.onLine&&await fetchFbNotices())render();
  refreshSaved();
}
/* 保存済みの端末は、通信できたときに控え（ページ・図・データ）を最新に入れ替える */
async function refreshSaved(){
  const sv=LS.get('kq50-saved',null);if(!sv||D.src.guide!=='net'||!('caches' in window))return;
  try{const c=await caches.open(CACHE);const list=[...BASE_LIST,...imgList()];
    for(const u of list){const r=await fetch(u+(u.startsWith('data/')?'?t='+Date.now():''),{cache:'no-store'});if(r.ok&&!r.headers.get('X-Saved-Copy'))await c.put(u,r)}
    sv.refreshedAt=new Date().toISOString();sv.guideUpdatedAt=D.guide.updatedAt;LS.set('kq50-saved',sv);
    const m=document.querySelector('#savedMsg');if(m&&!m.querySelector('.err'))m.innerHTML=savedText(sv);
  }catch(e){}
}
function savedText(sv){return `<b>保存済み</b>（${fmt(sv.at)} に保存${sv.refreshedAt?`、${fmt(sv.refreshedAt)} に最新へ更新`:''}。案内の最終更新 ${fmt(sv.guideUpdatedAt)}）<br>圏外でも、このページを開けば案内・地図を見られます。`}
function statusLine(){
  const st=$('#st'),sv=LS.get('kq50-saved',null);
  const on=D.src.notices==='net';
  if(on){st.className='st';st.textContent=`最新の案内を表示中（${fmt(D.fetchedAt.notices)} 取得）`+(sv?` ・端末に保存済み`:'')}
  else if(D.src.guide==='cache'){st.className='st off';st.textContent=`圏外のため、保存した版を表示中（案内の更新 ${fmt(D.guide&&D.guide.updatedAt)}／お知らせの更新 ${fmt(D.notices&&D.notices.updatedAt)}）`}
  else{st.className='st off';st.textContent='通信できません。通信できる場所で開き直してください'}
}
/* 本文の書式：## 見出し / - 箇条 / ![説明](画像) / [文字](URL) / {要確認:…} */
function md(body){
  const tbd=s=>s.replace(/\{要確認:[^}]*\}/g,'<span class="tbd">（調整中）</span>');
  const inl=s=>tbd(esc(s)).replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  let h='',ul=false;
  for(const line of String(body||'').split('\n')){
    const l=line.trim();
    if(!l.startsWith('- ')&&ul){h+='</ul>';ul=false}
    if(!l)continue;
    let m;
    if(l.startsWith('## '))h+=`<h2>${inl(l.slice(3))}</h2>`;
    else if(l.startsWith('- ')){if(!ul){h+='<ul>';ul=true}h+=`<li>${inl(l.slice(2))}</li>`}
    else if((m=l.match(/^\{gmap:([a-z0-9_-]+)\}$/i)))h+=gmapHTML(m[1]);
    else if((m=l.match(/^!\[([^\]]*)\]\(([^)]+)\)$/)))h+=`<img src="${esc(m[2])}" alt="${esc(m[1])}" loading="eager">`;
    else h+=`<p>${inl(l)}</p>`;
  }
  if(ul)h+='</ul>';return h;
}
/* Googleマップの埋め込み：通信できるときだけ地図を出し、圏外では保存済みの図と徒歩案内に誘導する */
function online(){return navigator.onLine&&D.src.guide==='net'}
function gmapHTML(key){
  const g=(D.guide.maps||{})[key];
  if(!g||!g.embed)return `<div class="gmap-off"><b>会場の地図は準備中です</b></div>`;
  const btn=`<a class="btn gbtn${online()?'':' dis'}" href="${esc(g.route)}" target="_blank" rel="noopener">Googleマップで経路を開く</a>`;
  if(!online())return `<div class="gmap-off"><b>Googleマップは通信できるときに表示されます</b><br>いまは圏外のため表示できません。下の駐車場の案内図と徒歩の案内をご覧ください。</div>${btn}<div class="muted" style="margin:4px 0 10px">経路のボタンも通信できるときに使えます</div>`;
  return `<div class="gmap"><iframe src="${esc(g.embed)}" title="${esc(g.label||'会場の地図')}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>${btn}<div class="muted" style="margin:4px 0 10px">地図：Google マップ（通信できるときに表示）</div>`;
}
/* ---- 本部のお知らせ（Firebase）：本部アカウントで書いたものを、ログインなしで読む。圏外では最後に受け取った分を表示 ---- */
const FB_PROJECT='trails-race',FB_KEY='AIzaSyAfuBxAeCQOhvdOurFOxpRysamQpz8lUJk';
const FB_EVENT=(()=>{const e=new URLSearchParams(location.search).get('ev');return ['kq50-2026','test-kq50'].includes(e)?e:'kq50-2026'})();
D.fbn=LS.get('kq50-fbn:'+FB_EVENT,null);
async function fetchFbNotices(){
  try{
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents/events/${FB_EVENT}/notices?pageSize=100&key=${FB_KEY}`,{cache:'no-store'});
    if(!r.ok)return false;const j=await r.json();const v=f=>f?(f.stringValue??f.booleanValue??f.timestampValue??f.integerValue??null):null;
    const items=(j.documents||[]).map(d=>{const f=d.fields||{};return{id:'fb-'+d.name.split('/').pop(),text:v(f.text)||'',important:!!v(f.important),hidden:!!v(f.hidden),at:v(f.at)||d.createTime}});
    const nx={at:new Date().toISOString(),items};const ch=JSON.stringify(items)!==JSON.stringify(D.fbn&&D.fbn.items);
    D.fbn=nx;LS.set('kq50-fbn:'+FB_EVENT,nx);return ch;
  }catch(e){return false}
}
function noticesHTML(){
  const n={items:[...((D.notices&&D.notices.items)||[]),...((D.fbn&&D.fbn.items)||[])]};if(!n.items.length)return '';
  const items=n.items.filter(x=>!x.hidden).sort((a,b)=>(b.important-a.important)||Date.parse(b.at)-Date.parse(a.at));
  return items.map(x=>`<div class="notice ${x.important?'':'n'}"><div class="h">${x.important?'重要なお知らせ':'お知らせ'}　<span class="tm">${fmt(x.at)}</span></div><div>${esc(x.text).replace(/\n/g,'<br>')}</div></div>`).join('');
}
/* ---- 名前からゼッケン番号を調べる ----
   公開データは「名前を一方向に変換した値→番号」だけ。正規化は tools/make_bibs.py の norm() と同じ手順 */
const VARIANTS={'髙':'高','﨑':'崎','嵜':'崎','邊':'辺','邉':'辺','濵':'浜','濱':'浜','齋':'斎','齊':'斎','斉':'斎','澤':'沢','櫻':'桜','廣':'広','國':'国','眞':'真','惠':'恵','德':'徳','藏':'蔵','嶋':'島','嶌':'島','峯':'峰','冨':'富','𠮷':'吉','槇':'槙','渕':'淵','栁':'柳','籠':'篭','曻':'昇','彌':'弥','龍':'竜','瀨':'瀬','靜':'静','壽':'寿','實':'実'};
function normName(s){
  s=String(s||'').normalize('NFKC').replace(/[\s・･.\-'’]/g,'');
  s=[...s].map(c=>{const o=c.codePointAt(0);return o>=0x3041&&o<=0x3096?String.fromCodePoint(o+0x60):c}).map(c=>VARIANTS[c]||c).join('').toUpperCase();
  if(/^[A-Z]+$/.test(s)){s=s.replace(/MB/g,'NB').replace(/MP/g,'NP').replace(/OU|OO|OH(?![AIUEO])/g,'O').replace(/UU/g,'U')}
  return s;
}
function bibInfo(bib){const r=((D.bibs&&D.bibs.rules)||[]).find(x=>x.prefix?String(bib).startsWith(x.prefix):(typeof bib==='number'&&bib>=x.from&&bib<=x.to));return r||{}}
/* 正式表記は「正しい名前を入れた人だけが読める」よう暗号化してある（鍵は入力した名前から作る） */
async function openName(enc,k){
  try{const b=Uint8Array.from(atob(enc.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
    const raw=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('name|'+D.bibs.salt+'|'+k));
    const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},key,b.slice(12)));
  }catch(e){return ''}
}
async function lookupBib(name){
  const k=normName(name);if(!k||!D.bibs)return [];
  const hit=D.bibs.h[(await sha256(D.bibs.salt+'|'+k)).slice(0,16)]||[];
  return Promise.all(hit.map(async e=>{if(!Array.isArray(e))return {bib:e,name:'',pk:''};const s=await openName(e[1],k);
    if(s.startsWith('{')){try{const o=JSON.parse(s);return {bib:e[0],name:o.n||'',pk:o.pk||''}}catch(x){}}return {bib:e[0],name:s,pk:''}}));
}
/* 受付で読み取る番号のQR（中身は番号だけ。端末の中で作るので圏外でも出る） */
function qrHTML(bib){try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(String(bib));q.make();return `<div class="qr">${q.createSvgTag({cellSize:6,margin:2,scalable:true})}</div><div class="qrl">受付ではこのQRを読み取ります</div>`}catch(e){return ''}}
const PKNOTE='※駐車券を事前に購入した方のみ駐車できます';
/* 駐車券の有無を、暗い中でも一目で分かる帯で出す（不明のときは従来の駐車場の表示） */
const PK_NG='駐車場には入れません。<br>乗り合わせまたは送迎を手配してください';
function parkHTML(i,pk,sm){
  if(pk==='あり')return `<div class="pkb ok${sm?' sm':''}">駐車券あり${i.parkLabel?`<small>${esc(i.parkLabel)}</small>`:''}</div>`;
  if(pk==='なし')return `<div class="pkb ng${sm?' sm':''}">駐車券なし<small>${PK_NG}</small></div>`;
  return '';
}
const whoHTML=n=>n?`<div class="who">${esc(n)}<small>さん</small></div>`:'';
function showBig(list){
  const one=list.length===1,name=list[0]&&list[0].name;
  const el=document.createElement('div');el.id='bigbib';el.setAttribute('role','dialog');
  el.innerHTML=one?(()=>{const b=list[0].bib,i=bibInfo(b),pk=list[0].pk;return `${whoHTML(name)}<div class="l">あなたのゼッケン番号</div><div class="n${String(b).length>4?' xs':String(b).length>2?' s':''}">${b}</div>
    <div>${i.cat?`<span class="chip">${esc(i.cat)}</span>`:''}${!pk&&i.parkLabel?`<span class="chip">${esc(i.parkLabel)}</span>`:''}</div>${pk?parkHTML(i,pk):i.parkLabel?`<div class="pk">${PKNOTE}</div>`:''}${qrHTML(b)}
    <div class="say">受付と駐車場の入口で、<br>この画面をスタッフに見せてください</div>`})()

  for(const t of toks){if(t==='\n'){lines.push(line);line=[];lw=0;continue}const a=tw(t);
    if(lw+a-ls>w&&line.length&&!NG.includes(t[0])){lines.push(line);line=[];lw=0}line.push(t);lw+=a}
  if(line.length)lines.push(line);
  // 最後の行以外は両端をそろえる
  lines.forEach((l,i)=>{const cs=l.flatMap(t=>[...t]),last=i===lines.length-1,used=cs.reduce((s,c)=>s+g.measureText(c).width,0),gap=last?ls:Math.min(ls*4,(w-used)/Math.max(1,cs.length-1));let cx=x;for(const c of cs){g.fillText(c,cx,y+i*lh);cx+=g.measureText(c).width+gap}});
}
async function saveImage(cv,name){
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.92));const f=new File([blob],name,{type:'image/jpeg'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

/* 画像1枚のPDF（A4縦）を端末内で作る：フォントを持ち込まずに日本語を出せる */
function downloadPDF(cv,name){
  const jpg=atob(cv.toDataURL('image/jpeg',0.92).split(',')[1]);const W=595.28,H=841.89;
  const parts=[];let len=0;const off=[];const add=s=>{parts.push(s);len+=s.length};
  add('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj=(n,body)=>{off[n]=len;add(`${n} 0 obj\n`);add(body);add('\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  obj(4,`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n${jpg}\nendstream`);
  const c=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;obj(5,`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
  const x=len;add(`xref\n0 6\n0000000000 65535 f \n`+[1,2,3,4,5].map(n=>String(off[n]).padStart(10,'0')+' 00000 n \n').join(''));
  add(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`);
  const s=parts.join('');const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([u],{type:'application/pdf'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}
